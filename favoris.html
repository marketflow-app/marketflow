<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketflow - Mes Favoris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f9fafb; }
        .purple-gradient { background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); }
    </style>
</head>
<body class="pb-24">

    <!-- En-tête -->
    <header class="purple-gradient text-white p-4 flex items-center gap-3 sticky top-0 z-40">
        <button onclick="window.location.href='index.html'" class="p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-lg font-bold">Mes Favoris</h1>
    </header>

    <div class="p-4">
        <div id="favorites-grid" class="grid grid-cols-2 gap-4">
            <p class="col-span-2 text-center text-gray-500 py-10">Chargement de vos favoris...</p>
        </div>
    </div>

    <!-- Barre de navigation en bas -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around py-3 z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <a href="index.html" class="text-gray-400 flex flex-col items-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-xs mt-1 font-medium">Accueil</span>
        </a>
        <a href="favoris.html" class="text-purple-600 flex flex-col items-center">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
            <span class="text-xs mt-1 font-medium">Favoris</span>
        </a>
        <a href="index.html" onclick="localStorage.setItem('openCart', 'true')" class="text-gray-400 flex flex-col items-center relative">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            <span class="text-xs mt-1 font-medium">Panier</span>
        </a>
        <a href="profil.html" class="text-gray-400 flex flex-col items-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-xs mt-1 font-medium">Profil</span>
        </a>
    </nav>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://yhjztyveqjptqvbozyqu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UbrfniqRP6waSl1gHOXErw_dXeGDlUL';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // On récupère les IDs des favoris depuis le localStorage
        let favoriteIds = JSON.parse(localStorage.getItem('marketflow_favorites')) || [];

        async function loadFavorites() {
            const grid = document.getElementById('favorites-grid');
            
            if (favoriteIds.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-10">Vous n\'avez pas encore de favoris.</p>';
                return;
            }

            // On récupère les produits correspondants
            const { data: products, error } = await supabase
                .from('products')
                .select('*')
                .in('id', favoriteIds);

            if (error) {
                grid.innerHTML = `<p class="text-red-500">Erreur: ${error.message}</p>`;
                return;
            }

            if (!products || products.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-10">Vos favoris ne sont plus disponibles.</p>';
                return;
            }

            grid.innerHTML = '';
            products.forEach(product => {
                const imageHtml = product.image_url 
                    ? `<img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover">` 
                    : `<span class="text-5xl">👟</span>`;

                grid.innerHTML += `
                    <div onclick="window.location.href='produit.html?id=${product.id}'" class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 cursor-pointer active:scale-95 transition">
                        <div class="bg-gray-50 rounded-xl h-32 flex items-center justify-center mb-2 overflow-hidden">
                            ${imageHtml}
                        </div>
                        <h4 class="font-semibold text-sm text-gray-800 truncate">${product.name}</h4>
                        <p class="text-purple-600 font-bold mt-1">${product.price} $</p>
                        <button onclick="event.stopPropagation(); removeFromFavorites(${product.id})" class="w-full mt-3 bg-red-50 text-red-600 font-bold py-2 rounded-lg text-sm active:scale-95 transition hover:bg-red-100">Retirer</button>
                    </div>
                `;
            });
        }

        window.removeFromFavorites = function(id) {
            favoriteIds = favoriteIds.filter(favId => favId !== id);
            localStorage.setItem('marketflow_favorites', JSON.stringify(favoriteIds));
            loadFavorites(); // Recharger la liste
        }

        loadFavorites();
    </script>
</body>
</html>

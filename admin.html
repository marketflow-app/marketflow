<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketflow - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .purple-gradient { background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); }
        .status-pending { background-color: #fef3c7; color: #92400e; }
        .status-shipped { background-color: #dbeafe; color: #1e40af; }
        .status-delivered { background-color: #d1fae5; color: #065f46; }
    </style>
</head>
<body class="pb-10">

    <!-- Écran de connexion -->
    <div id="login-screen" class="fixed inset-0 bg-gray-100 flex items-center justify-center p-6 z-50">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-sm text-center">
            <div class="w-16 h-16 purple-gradient rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Admin Marketflow</h1>
            <p class="text-gray-500 text-sm mb-6">Entre ton mot de passe pour accéder au tableau de bord.</p>
            <input type="password" id="admin-password" placeholder="Mot de passe" class="w-full p-3 border border-gray-300 rounded-xl mb-4 text-center focus:outline-none focus:ring-2 focus:ring-purple-500">
            <button onclick="checkPassword()" class="w-full purple-gradient text-white font-bold py-3 rounded-xl active:scale-95 transition">Se connecter</button>
            <p id="login-error" class="text-red-500 text-sm mt-3 hidden">Mot de passe incorrect.</p>
        </div>
    </div>

    <!-- Tableau de bord (caché par défaut) -->
    <div id="admin-panel" class="hidden">
        
        <!-- En-tête -->
        <header class="purple-gradient text-white p-6 rounded-b-3xl shadow-lg mb-6">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-sm opacity-80">Tableau de bord</p>
                    <h1 class="text-2xl font-bold">Marketflow Admin</h1>
                </div>
                <button onclick="logout()" class="bg-white/20 px-4 py-2 rounded-xl text-sm font-semibold active:scale-95 transition">Déconnexion</button>
            </div>
        </header>

        <!-- Onglets -->
        <div class="flex gap-2 px-4 mb-6">
            <button onclick="showTab('orders')" id="tab-orders" class="flex-1 py-2 rounded-xl font-bold text-sm bg-purple-600 text-white">Commandes</button>
            <button onclick="showTab('products')" id="tab-products" class="flex-1 py-2 rounded-xl font-bold text-sm bg-white text-gray-600">Produits</button>
        </div>

        <!-- Section Commandes -->
        <div id="section-orders" class="px-4">
            <div id="orders-list" class="space-y-4">
                <p class="text-center text-gray-500 py-4">Chargement des commandes...</p>
            </div>
        </div>

        <!-- Section Produits -->
        <div id="section-products" class="px-4 hidden">
            <!-- Formulaire d'ajout de produit -->
            <div class="bg-white p-6 rounded-2xl shadow-sm mb-6">
                <h3 class="font-bold text-gray-800 mb-4">Ajouter un nouveau produit</h3>
                <form id="product-form" onsubmit="addProduct(event)" class="space-y-3">
                    <input type="text" id="p-name" required placeholder="Nom du produit" class="w-full p-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <input type="number" id="p-price" required placeholder="Prix (ex: 99)" step="0.01" class="w-full p-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <input type="text" id="p-image" placeholder="URL de l'image (laisser vide si pas d'image)" class="w-full p-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <input type="text" id="p-category" required placeholder="Catégorie (ex: Sneakers)" class="w-full p-3 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <button type="submit" class="w-full purple-gradient text-white font-bold py-3 rounded-xl active:scale-95 transition">Ajouter le produit</button>
                </form>
            </div>

            <!-- Liste des produits existants -->
            <h3 class="font-bold text-gray-800 mb-3">Produits existants</h3>
            <div id="products-list" class="space-y-3">
                <p class="text-center text-gray-500 py-4">Chargement des produits...</p>
            </div>
        </div>

    </div>

    <!-- Script Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://yhjztyveqjptqvbozyqu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UbrfniqRP6waSl1gHOXErw_dXeGDlUL';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // ⚠️ CHANGE CE MOT DE PASSE COMME TU VEUX
        const ADMIN_PASSWORD = 'marketflow2026';

        // --- CONNEXION ---
        window.checkPassword = function() {
            const input = document.getElementById('admin-password').value;
            if (input === ADMIN_PASSWORD) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadOrders();
                loadProductsAdmin();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        window.logout = function() {
            window.location.reload();
        }

        // --- ONGLETS ---
        window.showTab = function(tab) {
            const ordersSection = document.getElementById('section-orders');
            const productsSection = document.getElementById('section-products');
            const ordersTab = document.getElementById('tab-orders');
            const productsTab = document.getElementById('tab-products');

            if (tab === 'orders') {
                ordersSection.classList.remove('hidden');
                productsSection.classList.add('hidden');
                ordersTab.className = 'flex-1 py-2 rounded-xl font-bold text-sm bg-purple-600 text-white';
                productsTab.className = 'flex-1 py-2 rounded-xl font-bold text-sm bg-white text-gray-600';
            } else {
                ordersSection.classList.add('hidden');
                productsSection.classList.remove('hidden');
                ordersTab.className = 'flex-1 py-2 rounded-xl font-bold text-sm bg-white text-gray-600';
                productsTab.className = 'flex-1 py-2 rounded-xl font-bold text-sm bg-purple-600 text-white';
            }
        }

        // --- CHARGEMENT DES COMMANDES ---
        async function loadOrders() {
            const container = document.getElementById('orders-list');
            const { data: orders, error } = await supabase
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded-xl text-sm">Erreur: ${error.message}</div>`;
                return;
            }

            if (!orders || orders.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-4">Aucune commande pour le moment.</p>';
                return;
            }

            container.innerHTML = '';
            orders.forEach(order => {
                const date = new Date(order.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                const statusClass = order.status === 'pending' ? 'status-pending' : (order.status === 'shipped' ? 'status-shipped' : 'status-delivered');
                const statusText = order.status === 'pending' ? 'En attente' : (order.status === 'shipped' ? 'Expédiée' : 'Livrée');
                
                let itemsHtml = '';
                if (Array.isArray(order.items)) {
                    itemsHtml = order.items.map(item => `<li>${item.quantity}x ${item.name} - ${item.price} $</li>`).join('');
                }

                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h4 class="font-bold text-gray-800">${order.customer_name}</h4>
                                <p class="text-sm text-gray-500">${order.customer_phone}</p>
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${statusClass}">${statusText}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-2">${order.customer_address}</p>
                        <div class="bg-gray-50 p-3 rounded-xl mb-3">
                            <p class="text-xs font-bold text-gray-500 uppercase mb-1">Articles</p>
                            <ul class="text-sm text-gray-700 list-disc list-inside">${itemsHtml || '<li>Aucun article</li>'}</ul>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-purple-600">${order.total_amount} $</span>
                            <span class="text-xs text-gray-400">${date}</span>
                        </div>
                        <div class="mt-3 flex gap-2">
                            <button onclick="updateStatus(${order.id}, 'shipped')" class="flex-1 bg-blue-100 text-blue-700 text-xs font-bold py-2 rounded-lg">Marquer Expédiée</button>
                            <button onclick="updateStatus(${order.id}, 'delivered')" class="flex-1 bg-green-100 text-green-700 text-xs font-bold py-2 rounded-lg">Marquer Livrée</button>
                        </div>
                    </div>
                `;
            });
        }

        window.updateStatus = async function(orderId, newStatus) {
            const { error } = await supabase
                .from('orders')
                .update({ status: newStatus })
                .eq('id', orderId);

            if (error) {
                alert("Erreur: " + error.message);
                return;
            }
            loadOrders(); // Recharger la liste
        }

        // --- CHARGEMENT DES PRODUITS ---
        async function loadProductsAdmin() {
            const container = document.getElementById('products-list');
            const { data: products, error } = await supabase
                .from('products')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                container.innerHTML = `<div class="bg-red-100 text-red-700 p-4 rounded-xl text-sm">Erreur: ${error.message}</div>`;
                return;
            }

            if (!products || products.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-4">Aucun produit.</p>';
                return;
            }

            container.innerHTML = '';
            products.forEach(product => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center gap-4">
                        <div class="w-16 h-16 bg-gray-100 rounded-xl overflow-hidden flex-shrink-0">
                            ${product.image_url ? `<img src="${product.image_url}" class="w-full h-full object-cover">` : '<span class="flex items-center justify-center h-full text-2xl">👟</span>'}
                        </div>
                        <div class="flex-grow">
                            <h4 class="font-bold text-gray-800 text-sm">${product.name}</h4>
                            <p class="text-purple-600 font-bold text-sm">${product.price} $</p>
                            <p class="text-xs text-gray-400">${product.category}</p>
                        </div>
                        <button onclick="deleteProduct(${product.id})" class="text-red-500 p-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
            });
        }

        window.addProduct = async function(event) {
            event.preventDefault();
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const imageUrl = document.getElementById('p-image').value;
            const category = document.getElementById('p-category').value;

            const { error } = await supabase
                .from('products')
                .insert([{ name, price, image_url: imageUrl, category }]);

            if (error) {
                alert("Erreur: " + error.message);
                return;
            }

            document.getElementById('product-form').reset();
            alert("Produit ajouté avec succès !");
            loadProductsAdmin();
        }

        window.deleteProduct = async function(productId) {
            if (!confirm("Supprimer ce produit ?")) return;
            const { error } = await supabase
                .from('products')
                .delete()
                .eq('id', productId);

            if (error) {
                alert("Erreur: " + error.message);
                return;
            }
            loadProductsAdmin();
        }

        // Chargement initial (si déjà connecté)
        // On laisse l'écran de login par défaut pour la sécurité
    </script>

</body>
  </html>

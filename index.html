<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketflow - Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .purple-gradient { background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); }
        /* Style pour la bulle du panier */
        .cart-badge {
            position: absolute; top: -5px; right: -5px;
            background-color: #ef4444; color: white;
            border-radius: 50%; width: 18px; height: 18px;
            font-size: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }
    </style>
</head>
<body class="pb-24">

    <!-- En-tête -->
    <header class="purple-gradient text-white p-6 rounded-b-3xl shadow-lg">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <h1 class="text-2xl font-bold">Marketflow</h1>
            </div>
            <button class="bg-white/20 p-2 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            </button>
        </div>
        <div class="mt-6">
            <p class="text-sm opacity-80">Découvrez</p>
            <h2 class="text-2xl font-bold">Les Derniers Produits</h2>
            <input type="text" placeholder="Rechercher des produits..." class="w-full mt-4 p-3 rounded-xl text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-purple-300">
        </div>
    </header>

    <!-- Bannière Promo -->
    <div class="mx-4 mt-4 bg-purple-100 rounded-2xl p-4 flex justify-between items-center">
        <div>
            <p class="text-purple-800 font-bold text-lg">Jusqu'à</p>
            <p class="text-purple-600 font-bold text-3xl">40% de réduction</p>
        </div>
        <div class="text-4xl">👟</div>
    </div>

    <!-- Catégories -->
    <div class="mt-6 px-4">
        <h3 class="font-bold text-gray-800 mb-3">Catégories</h3>
        <div class="flex gap-4 overflow-x-auto pb-2">
            <div class="bg-white p-3 rounded-xl shadow-sm text-center min-w-[80px]">
                <span class="text-2xl">👕</span>
                <p class="text-xs mt-1 font-medium">Mode</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm text-center min-w-[80px]">
                <span class="text-2xl">🎧</span>
                <p class="text-xs mt-1 font-medium">Électronique</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm text-center min-w-[80px]">
                <span class="text-2xl">🏠</span>
                <p class="text-xs mt-1 font-medium">Maison</p>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm text-center min-w-[80px]">
                <span class="text-2xl">💄</span>
                <p class="text-xs mt-1 font-medium">Beauté</p>
            </div>
        </div>
    </div>

    <!-- Produits -->
    <div class="mt-6 px-4">
        <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-gray-800">Sneakers Homme</h3>
            <a href="#" class="text-purple-600 text-sm font-semibold">Voir tout</a>
        </div>
        <div id="product-grid" class="grid grid-cols-2 gap-4">
            <p class="col-span-2 text-center text-gray-500 py-4">Chargement des produits...</p>
        </div>
    </div>

    <!-- Fenêtre Panier (cachée par défaut) -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex-col justify-end">
        <div class="bg-white w-full rounded-t-3xl p-6 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-gray-800">Mon Panier</h3>
                <button onclick="closeCart()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="cart-items" class="space-y-4 mb-4">
                <!-- Les articles du panier s'afficheront ici -->
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-gray-800">Total</span>
                    <span id="cart-total" class="font-bold text-purple-600 text-xl">0 $</span>
                </div>
                <button onclick="checkout()" class="w-full purple-gradient text-white font-bold py-3 rounded-xl active:scale-95 transition">Passer Commande</button>
            </div>
        </div>
    </div>

    <!-- Barre de navigation en bas -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around py-3 z-50">
        <a href="#" class="text-purple-600 flex flex-col items-center">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
            <span class="text-xs mt-1">Accueil</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            <span class="text-xs mt-1">Favoris</span>
        </a>
        <a href="#" onclick="openCart()" class="text-gray-400 flex flex-col items-center relative">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            <span class="text-xs mt-1">Panier</span>
            <!-- Bulle rouge -->
            <span id="cart-badge" class="cart-badge hidden">0</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="text-xs mt-1">Profil</span>
        </a>
    </nav>

    <!-- Script Supabase et Panier -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://yhjztyveqjptqvbozyqu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UbrfniqRP6waSl1gHOXErw_dXeGDlUL';

        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- GESTION DU PANIER ---
        let cart = JSON.parse(localStorage.getItem('marketflow_cart')) || [];

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalItems > 0) {
                badge.textContent = totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        window.addToCart = function(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            localStorage.setItem('marketflow_cart', JSON.stringify(cart));
            updateCartUI();
            alert(`${product.name} ajouté au panier !`);
        }

        window.openCart = function() {
            renderCartItems();
            document.getElementById('cart-modal').classList.remove('hidden');
            document.getElementById('cart-modal').classList.add('flex');
        }

        window.closeCart = function() {
            document.getElementById('cart-modal').classList.add('hidden');
            document.getElementById('cart-modal').classList.remove('flex');
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            const totalElement = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-4">Votre panier est vide.</p>';
                totalElement.textContent = '0 $';
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                container.innerHTML += `
                    <div class="flex items-center gap-4 bg-gray-50 p-3 rounded-xl">
                        <div class="w-16 h-16 bg-gray-200 rounded-lg overflow-hidden flex-shrink-0">
                            ${item.image_url ? `<img src="${item.image_url}" class="w-full h-full object-cover">` : '<span class="flex items-center justify-center h-full text-2xl">👟</span>'}
                        </div>
                        <div class="flex-grow">
                            <h4 class="font-semibold text-sm text-gray-800">${item.name}</h4>
                            <p class="text-purple-600 font-bold text-sm">${item.price} $</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQuantity(${index}, -1)" class="bg-gray-200 w-6 h-6 rounded flex items-center justify-center text-gray-600">-</button>
                            <span class="text-sm font-medium">${item.quantity}</span>
                            <button onclick="changeQuantity(${index}, 1)" class="bg-gray-200 w-6 h-6 rounded flex items-center justify-center text-gray-600">+</button>
                        </div>
                    </div>
                `;
            });

            totalElement.textContent = `${total.toFixed(2)} $`;
        }

        window.changeQuantity = function(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('marketflow_cart', JSON.stringify(cart));
            renderCartItems();
            updateCartUI();
        }

        window.checkout = function() {
            if (cart.length === 0) {
                alert("Votre panier est vide.");
                return;
            }
            alert("Fonctionnalité de commande bientôt disponible !");
            // Ici on ajoutera la logique pour envoyer la commande à Supabase
        }

        // --- CHARGEMENT DES PRODUITS ---
        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            
            const { data: products, error } = await supabase
                .from('products')
                .select('*');

            if (error) {
                console.error('Erreur Supabase:', error);
                grid.innerHTML = `<div class="col-span-2 bg-red-100 text-red-700 p-4 rounded-xl text-sm"><p class="font-bold">Erreur</p><p>${error.message}</p></div>`;
                return;
            }

            if (!products || products.length === 0) {
                grid.innerHTML = '<p class="col-span-2 text-center text-gray-500 py-4">Aucun produit disponible.</p>';
                return;
            }

            grid.innerHTML = '';

            products.forEach(product => {
                const imageHtml = product.image_url 
                    ? `<img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover">` 
                    : `<span class="text-5xl">👟</span>`;

                // On échappe les guillemets pour éviter les bugs dans le onclick
                const productJson = JSON.stringify(product).replace(/"/g, '&quot;');

                grid.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl shadow-sm">
                        <div class="bg-gray-100 rounded-xl h-32 flex items-center justify-center mb-2 overflow-hidden">
                            ${imageHtml}
                        </div>
                        <h4 class="font-semibold text-sm text-gray-800 truncate">${product.name}</h4>
                        <p class="text-purple-600 font-bold mt-1">${product.price} $</p>
                        <button onclick="addToCart(${productJson})" class="w-full mt-2 bg-purple-100 text-purple-700 font-bold py-2 rounded-lg text-sm active:scale-95 transition">Ajouter</button>
                    </div>
                `;
            });
        }

        // Initialisation
        loadProducts();
        updateCartUI();
    </script>

</body>
</html>

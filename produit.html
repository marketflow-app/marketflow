<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketflow - Détail Produit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .purple-gradient { background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%); }
        .cart-badge {
            position: absolute; top: -5px; right: -5px;
            background-color: #ef4444; color: white;
            border-radius: 50%; width: 18px; height: 18px;
            font-size: 10px; display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }
        .size-btn.active, .color-btn.active {
            border-color: #7c3aed;
            background-color: #f3e8ff;
            color: #7c3aed;
        }
    </style>
</head>
<body class="pb-24">

    <!-- En-tête simplifié -->
    <header class="purple-gradient text-white p-4 flex items-center gap-3 sticky top-0 z-40">
        <button onclick="window.location.href='index.html'" class="p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        <h1 class="text-lg font-bold">Détail du produit</h1>
    </header>

    <!-- Contenu du produit -->
    <div id="product-detail" class="pb-6">
        <p class="text-center text-gray-500 py-10">Chargement...</p>
    </div>

    <!-- Barre de navigation en bas -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 flex justify-around py-3 z-50">
        <a href="index.html" class="text-gray-400 flex flex-col items-center">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-xs mt-1">Accueil</span>
        </a>
        <a href="index.html" onclick="openCartFromDetail()" class="text-gray-400 flex flex-col items-center relative">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            <span class="text-xs mt-1">Panier</span>
            <span id="cart-badge" class="cart-badge hidden">0</span>
        </a>
    </nav>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://yhjztyveqjptqvbozyqu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_UbrfniqRP6waSl1gHOXErw_dXeGDlUL';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- GESTION DU PANIER (lecture seule ici) ---
        let cart = JSON.parse(localStorage.getItem('marketflow_cart')) || [];
        
        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalItems > 0) {
                badge.textContent = totalItems;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }
        updateCartBadge();

        // Rediriger vers le panier (on retourne à l'accueil avec le panier ouvert)
        window.openCartFromDetail = function() {
            window.location.href = 'index.html?openCart=true';
        }

        // --- RÉCUPÉRER L'ID DU PRODUIT DANS L'URL ---
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');

        let selectedSize = null;
        let selectedColor = null;
        let currentProduct = null;

        // --- CHARGER LE PRODUIT ---
        async function loadProduct() {
            const container = document.getElementById('product-detail');
            
            if (!productId) {
                container.innerHTML = '<p class="text-center text-gray-500 py-10">Aucun produit sélectionné.</p>';
                return;
            }

            const { data: product, error } = await supabase
                .from('products')
                .select('*')
                .eq('id', productId)
                .single();

            if (error || !product) {
                container.innerHTML = '<p class="text-center text-red-500 py-10">Produit introuvable.</p>';
                return;
            }

            currentProduct = product;
            const sizes = product.sizes ? product.sizes.split(',').map(s => s.trim()) : [];
            const colors = product.colors ? product.colors.split(',').map(c => c.trim()) : [];

            const imageHtml = product.image_url 
                ? `<img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover">` 
                : `<div class="w-full h-full flex items-center justify-center bg-gray-100"><span class="text-8xl">👟</span></div>`;

            // Générer les boutons de taille
            let sizesHtml = '';
            if (sizes.length > 0) {
                sizesHtml = `
                    <div class="mt-4">
                        <p class="text-sm font-bold text-gray-700 mb-2">Taille</p>
                        <div class="flex gap-2 flex-wrap">
                            ${sizes.map((size, i) => `
                                <button onclick="selectSize('${size}', this)" class="size-btn border-2 border-gray-200 rounded-xl px-4 py-2 text-sm font-medium text-gray-600 active:scale-95 transition">${size}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Générer les boutons de couleur
            let colorsHtml = '';
            if (colors.length > 0) {
                colorsHtml = `
                    <div class="mt-4">
                        <p class="text-sm font-bold text-gray-700 mb-2">Couleur</p>
                        <div class="flex gap-2 flex-wrap">
                            ${colors.map((color) => `
                                <button onclick="selectColor('${color}', this)" class="color-btn border-2 border-gray-200 rounded-xl px-4 py-2 text-sm font-medium text-gray-600 active:scale-95 transition">${color}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <!-- Image -->
                <div class="bg-white w-full h-72 overflow-hidden">
                    ${imageHtml}
                </div>

                <!-- Infos -->
                <div class="bg-white rounded-t-3xl -mt-6 relative p-6 shadow-sm">
                    <div class="flex justify-between items-start">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-800">${product.name}</h1>
                            <p class="text-purple-600 font-bold text-2xl mt-1">${product.price} $</p>
                        </div>
                        <span class="bg-purple-100 text-purple-700 text-xs font-bold px-3 py-1 rounded-full">${product.category || 'Produit'}</span>
                    </div>

                    <!-- Description -->
                    <div class="mt-4">
                        <p class="text-sm font-bold text-gray-700 mb-1">Description</p>
                        <p class="text-gray-500 text-sm leading-relaxed">${product.description || 'Aucune description disponible pour ce produit.'}</p>
                    </div>

                    ${sizesHtml}
                    ${colorsHtml}

                    <!-- Bouton Ajouter au panier -->
                    <button onclick="addToCartDetail()" class="w-full purple-gradient text-white font-bold py-4 rounded-xl mt-6 active:scale-95 transition">
                        Ajouter au panier
                    </button>
                </div>
            `;
        }

        // --- SÉLECTION TAILLE / COULEUR ---
        window.selectSize = function(size, btn) {
            document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedSize = size;
        }

        window.selectColor = function(color, btn) {
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedColor = color;
        }

        // --- AJOUTER AU PANIER ---
        window.addToCartDetail = function() {
            if (!currentProduct) return;

            // Vérifier si des tailles/couleurs sont disponibles et non sélectionnées
            const hasSizes = currentProduct.sizes && currentProduct.sizes.trim() !== '';
            const hasColors = currentProduct.colors && currentProduct.colors.trim() !== '';

            if (hasSizes && !selectedSize) {
                alert("Veuillez choisir une taille.");
                return;
            }
            if (hasColors && !selectedColor) {
                alert("Veuillez choisir une couleur.");
                return;
            }

            // On crée un identifiant unique pour le panier (produit + taille + couleur)
            const cartItemId = `${currentProduct.id}-${selectedSize || 'none'}-${selectedColor || 'none'}`;

            // On recharge le panier depuis le localStorage (au cas où il a changé)
            let currentCart = JSON.parse(localStorage.getItem('marketflow_cart')) || [];

            const existing = currentCart.find(item => item.cartItemId === cartItemId);
            if (existing) {
                existing.quantity += 1;
            } else {
                currentCart.push({
                    ...currentProduct,
                    cartItemId: cartItemId,
                    selectedSize: selectedSize,
                    selectedColor: selectedColor,
                    quantity: 1
                });
            }

            localStorage.setItem('marketflow_cart', JSON.stringify(currentCart));
            
            // Mettre à jour le badge
            cart = currentCart;
            updateCartBadge();

            alert(`${currentProduct.name} ajouté au panier !`);
        }

        // Initialisation
        loadProduct();
    </script>

</body>
</html>
